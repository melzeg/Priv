[project]
name = "email-labeler"
version = "0.1.0"
description = "Daily Gmail labeling agent for Wijn, Muziek and Zeilen"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-workflows[mistralai]>=3.10",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apps/worker/src/worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/worker/src"]
